# Controller Manager configuration
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    # Define the available controllers

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    rl_quadruped_wheel_controller:
      type: rl_quadruped_wheel_controller/LeggedWheelController

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"


rl_quadruped_wheel_controller:
  ros__parameters:
    update_rate: 200  # Hz
    robot_pkg: "sirius_wheel_piper_description"
    use_rl_thread: true
    model_folder: "rl_policy"

    joints:
      - fl_abad_joint
      - fl_hip_joint
      - fl_knee_joint
      - rl_abad_joint
      - rl_hip_joint
      - rl_knee_joint
      - fr_abad_joint
      - fr_hip_joint
      - fr_knee_joint
      - rr_abad_joint
      - rr_hip_joint
      - rr_knee_joint
      - fl_wheel_joint
      - rl_wheel_joint
      - fr_wheel_joint
      - rr_wheel_joint

    down_pos:
      - 0.0
      - 1.27
      - -2.8
      - 0.0
      - -1.27
      - 2.8
      - 0.0
      - 1.27
      - -2.8
      - 0.0
      - -1.27
      - 2.8
      - 0.0
      - 0.0
      - 0.0
      - 0.0

    stand_pos:
      - 0.0
      - 0.7
      - -1.6
      - 0.0
      - -0.7
      - 1.6
      - 0.0
      - 0.7
      - -1.6
      - 0.0
      - -0.7
      - 1.6
      - 0.0
      - 0.0
      - 0.0
      - 0.0

    stand_kp: 100.0
    stand_kd: 3.0

    command_interfaces:
      - effort
      - position
      - velocity
      - kp
      - kd

    state_interfaces:
      - effort
      - position
      - velocity

    feet_names:
      - FL_foot
      - FR_foot
      - RL_foot
      - RR_foot

    imu_name: "imu_sensor"
    base_name: "base"

    imu_interfaces:
      - orientation.w
      - orientation.x
      - orientation.y
      - orientation.z
      - angular_velocity.x
      - angular_velocity.y
      - angular_velocity.z
      - linear_acceleration.x
      - linear_acceleration.y
      - linear_acceleration.z