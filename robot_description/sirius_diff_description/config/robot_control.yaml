# Controller Manager configuration
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    # Define the available controllers

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    rl_quadruped_controller:
      type: rl_quadruped_controller/LeggedGymController

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"


rl_quadruped_controller:
  ros__parameters:
    update_rate: 200  # Hz
    robot_pkg: "sirius_diff_description"
    use_rl_thread: true
    model_folder: "rl_policy"

    joints:
      - LF_HAA
      - LF_HFE
      - LF_KFE
      - LH_HAA
      - LH_HFE
      - LH_KFE
      - RF_HAA
      - RF_HFE
      - RF_KFE
      - RH_HAA
      - RH_HFE
      - RH_KFE

    down_pos:
      - 0.0
      - 1.27
      - -2.8
      - 0.0
      - -1.27
      - 2.8
      - 0.0
      - 1.27
      - -2.8
      - 0.0
      - -1.27
      - 2.8

    stand_pos:
      - 0.0
      - 0.7
      - -1.5
      - 0.0
      - -0.7
      - 1.5
      - 0.0
      - 0.7
      - -1.5
      - 0.0
      - -0.7
      - 1.6

    stand_kp: 100.0
    stand_kd: 3.0

    command_interfaces:
      - effort
      - position
      - velocity
      - kp
      - kd

    state_interfaces:
      - effort
      - position
      - velocity

    feet_names:
      - FL_foot
      - FR_foot
      - RL_foot
      - RR_foot

    imu_name: "imu_sensor"
    base_name: "base"

    imu_interfaces:
      - orientation.w
      - orientation.x
      - orientation.y
      - orientation.z
      - angular_velocity.x
      - angular_velocity.y
      - angular_velocity.z
      - linear_acceleration.x
      - linear_acceleration.y
      - linear_acceleration.z