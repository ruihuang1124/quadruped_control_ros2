piper_controller:
  ros__parameters:
    update_rate: 1000 # Hz
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
      - joint8
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
      - effort